name: release

on:
  push:
    tags:
      # Bare SemVer tags only. MinVer reads the version straight off the tag,
      # so there is no version number anywhere else in the repository.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Write so the run can create the GitHub release for the tag it was triggered by.
      contents: write
      # Required so nuget.org can verify who is publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5

      - name: Build
        run: dotnet build Wapper.slnx --configuration Release

      - name: Test
        run: dotnet test --solution Wapper.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack Wapper.slnx --configuration Release --no-build --output artifacts

      # Requested immediately before the push: the key it returns lives about an hour.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # After the push, never before: a release page announcing a version that failed to
      # publish would be worse than none. The notes are the CHANGELOG's own section for the
      # version, so there is one source and not two, with GitHub's list of merged pull
      # requests and the compare link appended below them. An empty section — a tag with no
      # entry — leaves the generated part alone to carry it.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v version="## $TAG" \
            '$0 == version { found = 1; next } /^## / { found = 0 } found' \
            CHANGELOG.md > notes.md

          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac

          # Skipping an existing one keeps a re-run harmless, the way --skip-duplicate does
          # for the packages.
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" $prerelease --notes-file notes.md --generate-notes
