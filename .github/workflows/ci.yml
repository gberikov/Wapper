name: ci

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer walks the tag history to derive the version. A shallow clone
          # gives it nothing to walk.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5

      - name: Restore
        run: dotnet restore Wapper.slnx

      - name: Build
        run: dotnet build Wapper.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Wapper.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack Wapper.slnx --configuration Release --no-build --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  aot:
    name: native aot smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5

      # Building the libraries with IsAotCompatible only says the analysers found nothing.
      # Publishing an application ahead of time and running it is what proves the claim:
      # the container, source-generated JSON, the webhook endpoint and the client, trimmed.
      # Linux only: it is the runner with a native toolchain to hand; Windows and macOS
      # binaries are not exercised here.
      - name: Publish
        run: >
          dotnet publish samples/Wapper.AotSmoke/Wapper.AotSmoke.csproj
          --configuration Release --runtime linux-x64 --output artifacts/aot

      - name: Run
        run: ./artifacts/aot/Wapper.AotSmoke
